name: Labels

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    # Dependabot runs get a read-only token, and it labels its own PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Label from branch and files
        uses: actions/labeler@v7
