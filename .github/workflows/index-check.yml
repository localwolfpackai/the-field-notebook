name: Index check

on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/check-index.py"
      - ".github/workflows/index-check.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/check-index.py"
      - ".github/workflows/index-check.yml"

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check index density
        run: python3 scripts/check-index.py
