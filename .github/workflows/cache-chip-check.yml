name: Cache chip check

on:
  pull_request:
    paths:
      - "2026-06/the-90-percent-off-dial-prompt-caching-2026-06-29.html"
      - "scripts/check-cache-chips.py"
      - ".github/workflows/cache-chip-check.yml"
  push:
    branches:
      - main
    paths:
      - "2026-06/the-90-percent-off-dial-prompt-caching-2026-06-29.html"
      - "scripts/check-cache-chips.py"
      - ".github/workflows/cache-chip-check.yml"

permissions:
  contents: read

jobs:
  chips:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check the caching page title chips
        run: python3 scripts/check-cache-chips.py
