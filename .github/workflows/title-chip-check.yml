name: Title chip check

on:
  pull_request:
    paths:
      - "2026-06/cost-and-latency-two-dials-2026-06-25.html"
      - "scripts/check-title-chips.py"
      - ".github/workflows/title-chip-check.yml"
  push:
    branches:
      - main
    paths:
      - "2026-06/cost-and-latency-two-dials-2026-06-25.html"
      - "scripts/check-title-chips.py"
      - ".github/workflows/title-chip-check.yml"

permissions:
  contents: read

jobs:
  chips:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the cost page title chips
        run: python3 scripts/check-title-chips.py
