name: Link check

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.md"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --timeout 20
            --exclude '^https://fonts\.(googleapis|gstatic)\.com'
            './**/*.html'
            './**/*.md'
